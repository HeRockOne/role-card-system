<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色卡系统 v1.2 - NPC文件×管理理论×真人经验</title>
<style>
:root{--bg:#0f1115;--card:#1a1e26;--border:#2a3040;--text:#e5e9f0;--dim:#8b93a7;--accent:#4f8cff;--green:#3ddc84;--yellow:#ffd166;--red:#ff5d5d;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:"Microsoft YaHei","PingFang SC",sans-serif;min-height:100vh;}
header{padding:20px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
header h1{font-size:20px;font-weight:700;}
header .sub{color:var(--dim);font-size:12px;}
.tabs{display:flex;gap:8px;margin-left:auto;}
.tabBtn{padding:6px 16px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--dim);cursor:pointer;font-size:13px;}
.tabBtn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
main{padding:20px 28px;}
.toolbar{margin-bottom:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:12px;}
.btn:hover{border-color:var(--accent);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.danger{background:#2b1d1d;border-color:#4a2b2b;color:var(--red);}
.btn.danger:hover{border-color:var(--red);}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.toolbar input[type=search]{padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:12px;width:240px;}
.toolbar input[type=search]:focus{outline:none;border-color:var(--accent);}
.count{color:var(--dim);font-size:12px;}
.empty{grid-column:1/-1;text-align:center;color:var(--dim);font-size:13px;padding:48px 0;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.cardItem{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color .15s;}
.cardItem:hover{border-color:var(--accent);}
.cardItem .name{font-size:15px;font-weight:600;margin-bottom:6px;}
.cardItem .meta{font-size:11px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
.tag{padding:2px 8px;border-radius:10px;font-size:10px;background:#232a38;color:var(--dim);}
.tag.k-total{background:#1d2b1f;color:var(--green);}
.tag.k-sub{background:#2b2418;color:var(--yellow);}
.tag.k-instance{background:#2b1d1d;color:var(--red);}
.parentLink{color:var(--dim);font-size:11px;cursor:pointer;}
.parentLink:hover{color:var(--accent);}
.cardItem .account{font-size:12px;color:var(--text);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.drawer{position:fixed;top:0;right:-520px;width:480px;max-width:92vw;height:100%;background:#151923;border-left:1px solid var(--border);transition:right .25s;overflow-y:auto;z-index:50;padding:20px;}
.drawer.open{right:0;}
.drawer .close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer;}
.drawer h2{font-size:18px;margin-bottom:4px;padding-right:28px;}
.drawer .path{font-size:11px;color:var(--dim);margin-bottom:10px;}
.breadcrumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;}
.crumb{color:var(--accent);cursor:pointer;border:1px solid var(--border);border-radius:10px;padding:2px 8px;font-size:11px;background:var(--card);}
.crumb:hover{border-color:var(--accent);}
.crumbArrow{color:var(--dim);font-size:11px;}
.legend{font-size:10px;color:var(--dim);margin-bottom:14px;line-height:1.7;}
.drawer .actions{display:flex;gap:8px;margin-bottom:16px;}
.dimBlock{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:10px;}
.dimBlock .dimName{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:4px;}
.dimBlock .dimVal{font-size:13px;line-height:1.6;}
.dimBlock .src{font-size:10px;color:var(--dim);margin-top:4px;}
.src-inherit{color:var(--dim);}
.src-total{color:var(--accent);}
.src-override{color:var(--yellow);}
.src-patch{color:var(--green);}
.treeView{padding:4px 0;}
.treeGroup{color:var(--dim);font-size:12px;margin:16px 0 6px;letter-spacing:.5px;}
.treeRow{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid transparent;border-radius:8px;cursor:pointer;font-size:13px;flex-wrap:wrap;}
.treeRow:hover{background:var(--card);border-color:var(--border);}
.treeLine{color:var(--dim);font-family:Consolas,monospace;font-size:11px;min-width:14px;}
.treeName{font-weight:600;}
.treeMeta{color:var(--dim);font-size:11px;}
.treeHit{color:var(--green);font-size:11px;}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;}
.modal.open{display:flex;}
.modalBox{background:#151923;border:1px solid var(--border);border-radius:12px;padding:20px;width:680px;max-width:94vw;max-height:86vh;overflow-y:auto;}
.modalBox h3{margin-bottom:12px;font-size:16px;}
.newTip{background:#1a2233;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--dim);margin-bottom:12px;line-height:1.8;}
.newTip b{color:var(--text);}
.field{margin-bottom:10px;}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px;}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:#1a1e26;color:var(--text);font-size:13px;}
.field textarea{min-height:60px;resize:vertical;}
#dim-editor textarea{min-height:44px;}
.dimGuide{display:block;color:var(--dim);font-size:10px;font-weight:400;margin-top:2px;line-height:1.5;}
.dimInherit{display:block;font-size:10px;margin-top:4px;color:var(--yellow);line-height:1.5;}
.dimInherit.patch{color:var(--green);}
.dimInherit.inherit{color:var(--dim);}
.hint{font-size:10px;color:var(--dim);display:block;margin-bottom:4px;}
.modalBtns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;}
footer{padding:14px 28px;border-top:1px solid var(--border);color:var(--dim);font-size:11px;text-align:center;}
</style>
</head>
<body>
<header>
  <h1>🏯 角色卡系统 v1.2</h1>
  <span class="sub">NPC文件 × 管理理论 × 真人经验 | 总卡→分卡→实例 三层继承</span>
  <div class="tabs">
    <button class="tabBtn active" data-tab="total" onclick="setTab('total')">总卡</button>
    <button class="tabBtn" data-tab="sub" onclick="setTab('sub')">分卡</button>
    <button class="tabBtn" data-tab="instance" onclick="setTab('instance')">实例卡</button>
    <button class="tabBtn" data-tab="tree" onclick="setTab('tree')">🌳 继承链</button>
  </div>
</header>
<main>
  <div class="toolbar">
    <button class="btn primary" onclick="openNew()">+ 新建角色卡</button>
    <button class="btn" onclick="exportJSON()">导出 JSON</button>
    <button class="btn" onclick="importJSON()">导入 JSON</button>
    <input type="search" id="f-search" placeholder="🔍 搜索: 名称 / 宗门 / 堂口 / 层级 / 描述" oninput="searchKw=this.value.trim(); refreshView();">
    <span class="count" id="f-count"></span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="treeView" id="treeView" style="display:none"></div>
</main>
<div class="drawer" id="drawer"></div>
<div class="modal" id="modal">
  <div class="modalBox">
    <h3 id="modal-title">新建角色卡</h3>
    <div class="newTip">💡 一句话建模法:先答三问——<b>他能做什么</b>(权杖边界)、<b>他要什么</b>(使命与账本)、<b>他怕什么</b>(恐惧清单)。其余维度按需补充,<b>留空即继承父层,不用全填</b>。写完下面每一维都有参考示例。</div>
    <div class="field"><label>类型</label>
      <select id="f-kind" onchange="onKindChange()">
        <option value="sub">分卡(继承总卡)</option>
        <option value="instance">实例卡(继承分卡)</option>
        <option value="total">总卡(独立)</option>
      </select></div>
    <div class="field"><span class="hint" id="f-parenthint"></span>
      <select id="f-parent" onchange="onParentChange()"><option value="">无</option></select></div>
    <div class="field"><label>名称 *</label><input id="f-name" placeholder="如: 中型制造-采购长老"></div>
    <div class="field"><label>宗门类型</label><input id="f-sect" placeholder="中型制造 / 电商 / 外贸"></div>
    <div class="field"><label>堂口</label><input id="f-hall" placeholder="财务 / 市场 / 后勤"></div>
    <div class="field"><label>层级</label><input id="f-level" placeholder="长老 / 主管 / 宗主"></div>
    <div class="field"><label>一句话摘要</label><textarea id="f-account" placeholder="账本摘要,如:KPI=成本/应收/审计,怕呆坏账"></textarea></div>
    <div class="field"><span class="hint">维度编辑:只写与父层不同的内容。黄色提示=该维继承自哪层;清空已有值并保存=撤销这条覆盖。</span></div>
    <div id="dim-editor"></div>
    <div class="modalBtns">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" id="modal-ok" onclick="saveCard()">创建</button>
    </div>
  </div>
</div>
<footer>角色卡系统 v1.2 · 合并铁律:共性上升 / 差异下沉 / 互斥分叉 / 补丁隔离 · 先认岗位再认人,留空即继承</footer>
<script>
/* ============ 数据模型:三层继承 total > sub > instance ============ */
const DIMS = ["身份档案","权杖边界","使命与账本","恐惧清单","弦外之音","决策风格","沟通频道","资源网络","考核与晋升","红线雷区"];

/* 十维「人话翻译」:每维一句话提问 + 示例,降低填写门槛 */
const DIM_GUIDE = {
 "身份档案":"他是谁、什么岗位、在哪个层级?例:退货组主管带1人,直属后勤长老",
 "权杖边界":"他能批什么、动不了什么?例:批5000内报销,动不了编制和预算",
 "使命与账本":"他的KPI / 账本是什么?例:错误率≤0.5%、月均处理507笔",
 "恐惧清单":"他怕什么?哪句话会踩雷?例:怕账实不符被审计抓",
 "弦外之音":"口头禅背后的真意?例:'再想想'=不同意,'尽量明天发'=明天必须发",
 "决策风格":"他怎么拍板?数据/直觉/共识/独断?例:只信单据凭证",
 "沟通频道":"话往哪递?报表/数据/直给/留痕?例:递报表+成本一页纸,先报忧后报喜",
 "资源网络":"他依赖谁、卡着谁?例:依赖宗主背书,卡财务报销",
 "考核与晋升":"他被谁考核、怎么升?例:宗主打分,绩效×潜力九宫格",
 "红线雷区":"什么一票否决?碰了就死?例:虚报费用、隐瞒坏账"
};

/* 种子数据:总卡(物种级共性) */
const TOTAL_CARDS = [
 {id:"total-boss",name:"宗主总卡",sect:"全宗门",hall:"宗主",level:"总",
  account:"定方向、活下来。最怕亏钱爆雷,只算三行账:出活、添麻烦、干多久。",
  dims:{
   "身份档案":"决策层,对全部堂口有最终裁决权",

   "使命与账本":"盈利与现金流;识人用人与团队驾驭力",
   "恐惧清单":"现金流失血、核心人跑路、重大合规爆雷",

   "决策风格":"直觉+数据混合,喜欢确定性,讨厌惊喜(尤其坏惊喜)",
   "沟通频道":"听结论不听过程;带方案做选择题,不做问答题",
   "资源网络":"上游资方/董事会,平级高管联盟,下游向心力",
   "考核与晋升":"九宫格定位:绩效×潜力;德勇才排序,德第一",
   "红线雷区":"造假、抢功甩锅、越级架空、凌驾业务一票否决"}},
 {id:"total-func",name:"职能长老总卡",sect:"全宗门",hall:"职能堂口",level:"总",
  account:"承上启下、执行变现。共性:KPI稳、不添乱。",
  dims:{
   "身份档案":"中层,业务/职能堂口负责人,向上汇报",
   "权杖边界":"本口人事建议权、执行决策权,重大事项报宗主",
   "使命与账本":"把宗主管意图翻译成执行,把执行结果翻成报告",

</script>
<script>
/* 分卡:只存差异(delta),继承父卡 */

<script>
/* 实例卡:只存补丁,继承分卡 */
const INSTANCE_CARDS = [
 {id:"ins-lixx",parentId:"sub-log-mfg",name:"李XX(实际)",sect:"中型制造",hall:"后勤/退货组",level:"主管",
  account:"退货组主管,月均507笔,错误率≤0.5%,5个Python工具,独立写SOP 173行。",
  patches:{
   "身份档案":"2人退货组主管(带1人),直属后勤长老",
   "使命与账本":"退货全流程管理+流程优化+数据报表;KPI=错误率≤0.5%",
   "恐惧清单":"数据口径打架、被追第三层答不出、跨部门推不动",
   "弦外之音":"警惕'AI写的代码'被误读为'没本事';空白期30个月要正面回答",
   "决策风格":"实操先行,先做能做的,时间线拆解法",
   "沟通频道":"数据说话(507笔/173行/2天);主动认错纠口径",
   "红线雷区":"绝不做阿酥式包装;诚实是护城河"}},
 {id:"ins-zhangfin",parentId:"sub-fin-mfg",name:"张财务(实际)",sect:"中型制造",hall:"财务",level:"长老",
  account:"付款审批、预算控制,怕呆坏账和账实不符。",
  patches:{
   "弦外之音":"他说'再想想'=不同意(会议室皱眉那次)",
   "沟通频道":"特批前先备齐单据,别拿口头承诺"}},
 {id:"ins-wlmaster",parentId:"sub-log-mfg",name:"王主管(实际)",sect:"中型制造",hall:"后勤/仓储",level:"长老",
  account:"管仓发货,怕断供爆仓。",
  patches:{
   "恐惧清单":"退货组数据出错会连带他背锅",
   "弦外之音":"'尽量明天发'=明天必须发,别试探"}}
];
</script>
<script>
/* ============ 解析引擎:沿 parentId 合并链,子层覆盖父层 ============ */
function findCard(id){
  for(const c of [...TOTAL_CARDS,...SUB_CARDS,...INSTANCE_CARDS]) if(c.id===id) return c;
  return null;
}
function kindOf(card){
  if(card.kind) return card.kind;
  return card.id.startsWith("total")?"total":(card.id.startsWith("sub")?"sub":"instance");
}
function resolveCard(card){
  const out={};
  const chain=[];
  let cur=card;
  while(cur){ chain.unshift(cur); cur=cur.parentId?findCard(cur.parentId):null; }
  chain.forEach(c=>{
    const kind=kindOf(c);
    if(c.dims){ Object.entries(c.dims).forEach(([k,v])=>{ out[k]={val:v,src:kind}; }); }
    if(c.patches){ Object.entries(c.patches).forEach(([k,v])=>{ out[k]={val:v,src:"patch"}; }); }
  });
  DIMS.forEach(d=>{ if(!out[d]) out[d]={val:"(继承:未定义)",src:"inherit"}; });
  return out;
}
/* 沿父子链向上找某一维的显式定义来源 */
function sourceOf(card, dim){
  let cur=card;
  while(cur){
    const t=(kindOf(cur)==="instance")?(cur.patches||{}):(cur.dims||{});
    if(t[dim]) return {card:cur, val:t[dim], kind:kindOf(cur)};
    cur=cur.parentId?findCard(cur.parentId):null;
  }
  return null;
}
/* 从当前卡一路到根的继承链(自总卡 → 当前卡) */
function chainOf(card){
  const arr=[]; let cur=card;
  while(cur){ arr.unshift(cur); cur=cur.parentId?findCard(cur.parentId):null; }
  return arr;
}
const KIND_LABEL={total:"总卡",sub:"分卡",instance:"实例卡"};
const SRC_CLASS={inherit:"src-inherit",total:"src-total",sub:"src-override",patch:"src-patch"};
const SRC_LABEL={inherit:"继承(未定义)",total:"总卡共性",sub:"分卡定义",patch:"个人补丁"};
const SRC_TIP={inherit:"此维整条链都没定义,显示占位",total:"跨行业共性,由总卡定义",sub:"该分卡的特殊定义(差异下沉)",patch:"实例卡的个人补丁(只归本人)"};

function pool(kind){ return kind==="total"?TOTAL_CARDS:kind==="sub"?SUB_CARDS:INSTANCE_CARDS; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ============ 状态 ============ */
let currentTab="total";
let searchKw="";
let editingId=null;
let openCardId=null;

function matchesKw(c,kw){
  return [c.name,c.sect,c.hall,c.level,c.account].join(" ").toLowerCase().includes(kw);
}
function refreshView(){
  if(currentTab==="tree") renderTree(); else renderGrid();
}

/* ============ 网格渲染(支持搜索) ============ */
function renderGrid(){
  const grid=document.getElementById("grid");
  const kw=searchKw.toLowerCase();
  const cards=pool(currentTab).filter(c=>!kw||matchesKw(c,kw));
  grid.innerHTML="";
  document.getElementById("f-count").textContent="共 "+cards.length+" 张";
  if(!cards.length){
    grid.innerHTML='<div class="empty">没有匹配的角色卡'+(kw?'(换个关键词试试)':'')+'</div>';
    return;
  }
  cards.forEach(c=>{
    const el=document.createElement("div");
    el.className="cardItem";
    const k=kindOf(c);
    const p=c.parentId?findCard(c.parentId):null;
    el.innerHTML=`<div class="name">${esc(c.name)}</div>
      <div class="meta"><span class="tag k-${k}">${KIND_LABEL[k]}</span>
        ${p?`<span class="parentLink" title="查看父卡: ${esc(p.name)}" onclick="event.stopPropagation();openDrawer('${p.id}')">↑ ${esc(p.name)}</span>`:""}
        <span>${esc(c.sect)}</span><span>${esc(c.hall)}</span><span>${esc(c.level)}</span></div>
      <div class="account">${esc(c.account)}</div>`;
    el.onclick=()=>openDrawer(c.id);
    grid.appendChild(el);
  });
  document.querySelectorAll(".tabBtn").forEach(b=>b.classList.toggle("active",b.dataset.tab===currentTab));
}

/* ============ 继承链视图(树) ============ */
function renderTree(){
  const box=document.getElementById("treeView");
  const kw=searchKw.toLowerCase();
  const all=[...TOTAL_CARDS,...SUB_CARDS,...INSTANCE_CARDS];
  const childrenOf=p=>all.filter(c=>c.parentId===p);
  const roots=all.filter(c=>!c.parentId||!findCard(c.parentId));
  /* 子树是否含匹配节点 */
  function subtreeVisible(id){
    const c=findCard(id);
    if(!kw||matchesKw(c,kw)) return true;
    return childrenOf(id).some(k=>subtreeVisible(k.id));
  }
  function treeHTML(id,depth){
    const c=findCard(id);
    const m=!kw||matchesKw(c,kw);
    const kids=childrenOf(id).filter(k=>subtreeVisible(k.id));
    if(!m&&!kids.length) return "";
    const line=depth?("└─ ".padStart(depth*2+2," ")):"●";
    let h=`<div class="treeRow" style="padding-left:${depth*22}px" onclick="openDrawer('${c.id}')">
      <span class="treeLine">${line}</span>
      <span class="tag k-${kindOf(c)}">${KIND_LABEL[kindOf(c)]}</span>
      <span class="treeName">${esc(c.name)}</span>
      <span class="treeMeta">${esc(c.sect)} / ${esc(c.hall)} / ${esc(c.level)}${c.parentId?("  ↑ "+esc(findCard(c.parentId).name)):""}</span>
      ${m&&kw?'<span class="treeHit">✓命中</span>':''}
    </div>`;
    kids.forEach(k=>{ h+=treeHTML(k.id,depth+1); });
    return h;
  }
  let html="";
  roots.forEach(r=>{
    html+=`<div class="treeGroup">— 继承根: ${esc(r.name)}</div>`;
    html+=treeHTML(r.id,0);
  });
  const total=all.filter(c=>!kw||matchesKw(c,kw)).length;
  document.getElementById("f-count").textContent="共 "+total+" 张";
  box.innerHTML=html||'<div class="empty">没有匹配的角色卡</div>';
}

/* ============ 抽屉:详情 + 面包屑 + 编辑/删除 ============ */
function openDrawer(id){
  const card=findCard(id);
  if(!card) return;
  openCardId=id;
  const rs=resolveCard(card);
  const chain=chainOf(card);
  const k=kindOf(card);
  const d=document.getElementById("drawer");
  const crumb=chain.map(c=>`<span class="crumb" onclick="openDrawer('${c.id}')">${KIND_LABEL[kindOf(c)]}: ${esc(c.name)}</span>`)
    .join('<span class="crumbArrow">→</span>');
  let html=`<button class="close" onclick="closeDrawer()">×</button>
    <h2>${esc(card.name)}</h2>
    <div class="path">${esc(card.sect)} / ${esc(card.hall)} / ${esc(card.level)} / v${card.version||1}</div>
    <div class="breadcrumb">${crumb}</div>
    <div class="actions">
      <button class="btn primary" onclick="openEdit('${card.id}')">✏️ 编辑</button>
      <button class="btn danger" onclick="deleteCard('${card.id}')">🗑 删除</button>
    </div>
    <div class="legend">图例: <span class="src-total">蓝=总卡共性</span> · <span class="src-override">黄=分卡定义</span> · <span class="src-patch">绿=个人补丁</span> · <span class="src-inherit">灰=未定义</span>。点面包屑可回到上层卡。</div>`;
  DIMS.forEach(dim=>{
    const r=rs[dim];
    html+=`<div class="dimBlock"><div class="dimName">${dim} <span style="font-weight:400">— ${DIM_GUIDE[dim]}</span></div>
      <div class="dimVal">${esc(r.val)}</div>
      <div class="src ${SRC_CLASS[r.src]||"src-inherit"}">来源:${SRC_LABEL[r.src]||r.src} · ${SRC_TIP[r.src]||""}</div></div>`;
  });
  d.innerHTML=html; d.classList.add("open");
}
function closeDrawer(){
  document.getElementById("drawer").classList.remove("open");
  openCardId=null;
}

/* ============ 删除(带子卡依赖保护) ============ */
function deleteCard(id){
  const card=findCard(id);
  if(!card) return;
  const kids=[...SUB_CARDS,...INSTANCE_CARDS].filter(c=>c.parentId===id);
  if(kids.length){
    alert(`无法删除「${card.name}」:有 ${kids.length} 张子卡依赖它( ${kids.map(k=>k.name).join("、")} )。请先删除或改挂这些子卡的父卡。`);
    return;
  }
  if(!confirm(`确定删除「${card.name}」?该操作不可撤销,将从本地存储中移除。`)) return;
  const arr=pool(kindOf(card));
  const idx=arr.findIndex(c=>c.id===id);
  if(idx>=0) arr.splice(idx,1);
  closeDrawer();
  persist(); refreshView();
}

/* ============ 新建 / 编辑弹窗(共用 modal) ============ */
function onKindChange(){
  const kind=document.getElementById("f-kind").value;
  loadParentOptions(kind);
  onParentChange();
}
function loadParentOptions(kind){
  const sel=document.getElementById("f-parent");
  sel.innerHTML='<option value="">无</option>';
  const list= kind==="sub"?TOTAL_CARDS : kind==="instance"?SUB_CARDS : [];
  list.forEach(c=>{ const o=document.createElement("option");o.value=c.id;o.text="["+KIND_LABEL[kindOf(c)]+"] "+c.name;sel.appendChild(o); });
  document.getElementById("f-parenthint").textContent =
    kind==="total" ? "总卡为独立卡,无父卡" :
    kind==="sub"   ? "父卡(继承源): 总卡 — 分卡只写与总卡不同的差异" :
                     "父卡(继承源): 分卡 — 实例卡只写这个人的个人补丁";
}
function loadDimEditor(){
  const box=document.getElementById("dim-editor");
  box.innerHTML="";
  DIMS.forEach((d,i)=>{
    const wrap=document.createElement("div");
    wrap.className="field";
    wrap.innerHTML=`<label>${i+1}. ${esc(d)}<span class="dimGuide">${esc(DIM_GUIDE[d])}</span></label>
      <textarea id="f-dim-${i}" placeholder="(留空=继承父层)"></textarea>
      <span class="dimInherit inherit" id="f-dimsrc-${i}"></span>`;
    box.appendChild(wrap);
  });
}
/* 依据当前填写值与父卡,刷新每个维度的继承提示 */
function onParentChange(){
  const p=document.getElementById("f-parent").value;
  const parent=p?findCard(p):null;
  DIMS.forEach((d,i)=>{
    const s=document.getElementById("f-dimsrc-"+i); if(!s) return;
    const ta=document.getElementById("f-dim-"+i);
    const explicit=(ta.value||"").trim();
    if(explicit){ s.textContent="✏️ 本卡已在此定义(将覆盖父层)"; s.className="dimInherit patch"; return; }
    if(!parent){ s.textContent="🈳 未选父卡 — 留空则显示(继承:未定义)"; s.className="dimInherit inherit"; return; }
    const src=sourceOf(parent,d);
    if(src){ s.textContent="🌳 继承自 ["+KIND_LABEL[src.kind]+": "+src.card.name+"]: "+(src.val+"").slice(0,44)+(src.val.length>44?"…":""); s.className="dimInherit"; }
    else { s.textContent="🈳 父链未定义此维 — 留空则显示(继承:未定义)"; s.className="dimInherit inherit"; }
  });
}
function openModal(title, okText){
  document.getElementById("modal-title").textContent=title;
  document.getElementById("modal-ok").textContent=okText;
  document.getElementById("modal").classList.add("open");
}
function closeModal(){ document.getElementById("modal").classList.remove("open"); editingId=null; }

function openNew(){
  editingId=null;
  document.getElementById("f-kind").value="sub";
  document.getElementById("f-kind").disabled=false;
  document.getElementById("f-name").value="";
  document.getElementById("f-sect").value="";
  document.getElementById("f-hall").value="";
  document.getElementById("f-level").value="";
  document.getElementById("f-account").value="";
  loadParentOptions("sub");
  loadDimEditor();
  onParentChange();
  openModal("新建角色卡","创建");
}
function openEdit(id){
  const card=findCard(id);
  if(!card) return;
  editingId=id;
  const k=kindOf(card);
  document.getElementById("f-kind").value=k;
  document.getElementById("f-kind").disabled=true;
  document.getElementById("f-name").value=card.name||"";
  document.getElementById("f-sect").value=card.sect||"";
  document.getElementById("f-hall").value=card.hall||"";
  document.getElementById("f-level").value=card.level||"";
  document.getElementById("f-account").value=card.account||"";
  loadParentOptions(k);
  if(card.parentId){
    const sel=document.getElementById("f-parent");
    if(![...sel.options].some(o=>o.value===card.parentId)){
      const o=document.createElement("option");
      o.value=card.parentId; o.text="[已删除] "+card.parentId;
      sel.appendChild(o);
    }
    sel.value=card.parentId;
  }
  loadDimEditor();
  const tgt=(k==="instance")?(card.patches||{}):(card.dims||{});
  DIMS.forEach((d,i)=>{
    document.getElementById("f-dim-"+i).value=tgt[d]||"";
  });
  onParentChange();
  openModal("编辑: "+card.name,"保存");
}

/* 收集维度编辑器中的非空值 */
function collectDims(){
  const out={};
  DIMS.forEach((d,i)=>{
    const v=(document.getElementById("f-dim-"+i).value||"").trim();
    if(v) out[d]=v;
  });
  return out;
}
function saveCard(){
  if(editingId) saveEdit(); else createCard();
}
function createCard(){
  const kind=document.getElementById("f-kind").value;
  const parent=document.getElementById("f-parent").value;
  const name=document.getElementById("f-name").value.trim();
  const sect=document.getElementById("f-sect").value.trim();
  const hall=document.getElementById("f-hall").value.trim();
  const level=document.getElementById("f-level").value.trim();
  const account=document.getElementById("f-account").value.trim();
  if(!name){alert("名称必填");return;}
  if(kind!=="total" && !parent){alert("分卡/实例卡必须选择父卡(继承源)");return;}
  const id="card-"+Date.now().toString(36);
  const card={id,name,sect,hall,level,account,version:1,kind};
  if(kind!=="total") card.parentId=parent;
  if(kind==="instance") card.patches=collectDims(); else card.dims=collectDims();
  pool(kind).push(card);
  closeModal(); persist(); refreshView();
}
function saveEdit(){
  const card=findCard(editingId);
  if(!card) return;
  const k=kindOf(card);
  const parent=document.getElementById("f-parent").value;
  const name=document.getElementById("f-name").value.trim();
  const sect=document.getElementById("f-sect").value.trim();
  const hall=document.getElementById("f-hall").value.trim();
  const level=document.getElementById("f-level").value.trim();
  const account=document.getElementById("f-account").value.trim();
  if(!name){alert("名称必填");return;}
  if(k!=="total" && !parent){alert("分卡/实例卡必须选择父卡(继承源)");return;}
  card.name=name; card.sect=sect; card.hall=hall; card.level=level; card.account=account;
  card.parentId=(k==="total")?undefined:parent;
  const tgt=(k==="instance")?(card.patches=card.patches||{}):(card.dims=card.dims||{});
  DIMS.forEach((d,i)=>{
    const v=document.getElementById("f-dim-"+i).value.trim();
    if(v) tgt[d]=v; else delete tgt[d];
  });
  closeModal(); persist(); refreshView();
  if(openCardId===card.id) openDrawer(card.id);
}

/* ============ 视图切换 ============ */
function setTab(kind){
  currentTab=kind;
  const grid=document.getElementById("grid");
  const tree=document.getElementById("treeView");
  if(kind==="tree"){ grid.style.display="none"; tree.style.display="block"; renderTree(); }
  else { grid.style.display="grid"; tree.style.display="none"; renderGrid(); }
}

/* ============ 导出 / 导入 JSON ============ */
function exportJSON(){
  const data={total:TOTAL_CARDS,sub:SUB_CARDS,instance:INSTANCE_CARDS};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="角色卡数据.json";a.click();
}
function importJSON(){
  const inp=document.createElement("input");inp.type="file";inp.accept=".json";
  inp.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      TOTAL_CARDS.length=0;SUB_CARDS.length=0;INSTANCE_CARDS.length=0;
      (d.total||[]).forEach(c=>TOTAL_CARDS.push(c));
      (d.sub||[]).forEach(c=>SUB_CARDS.push(c));
      (d.instance||[]).forEach(c=>INSTANCE_CARDS.push(c));
      closeDrawer(); persist(); refreshView(); alert("导入成功");
    }catch(err){alert("JSON格式错误");} };
    r.readAsText(f);
  };
  inp.click();
}

/* ============ 初始化:localStorage 持久化 ============ */
function persist(){
  if(!localStorage) return;
  try{
    localStorage.setItem("rcs_v1",JSON.stringify({total:TOTAL_CARDS,sub:SUB_CARDS,instance:INSTANCE_CARDS}));
  }catch(e){}
}
function loadPersist(){
  try{
    const raw=localStorage.getItem("rcs_v1");
    if(!raw) return;
    const d=JSON.parse(raw);
    if(Array.isArray(d.total)&&d.total.length){ TOTAL_CARDS.length=0; d.total.forEach(c=>TOTAL_CARDS.push(c)); }
    if(Array.isArray(d.sub)&&d.sub.length){ SUB_CARDS.length=0; d.sub.forEach(c=>SUB_CARDS.push(c)); }
    if(Array.isArray(d.instance)&&d.instance.length){ INSTANCE_CARDS.length=0; d.instance.forEach(c=>INSTANCE_CARDS.push(c)); }
  }catch(e){}
}

loadPersist();
renderGrid();
</script>
